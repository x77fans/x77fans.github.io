<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>X77Fans リンクカード作成</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080e20;color:#edf3ff;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:45px 24px}h1{font-size:30px}small,p{color:#acb9d5;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:#121c32;border:1px solid #293651;border-radius:18px;padding:25px}label{display:block;margin:18px 0 8px}input{width:100%;padding:12px;border:1px solid #43516e;border-radius:8px;background:#080f20;color:white;font:inherit}button,.link{background:#22c7ec;color:#031521;border:0;border-radius:9px;padding:13px 20px;font:700 16px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#67d9f2}#preview{width:100%;aspect-ratio:1200/630;background:#070d1c;border-radius:12px}#status{white-space:pre-wrap;overflow-wrap:anywhere}#result{margin-top:20px}#result input{margin:12px 0}details{margin-top:20px}li{margin:10px 0;line-height:1.6}@media(max-width:750px){.grid{grid-template-columns:1fr}}.badge{color:#22c7ec;font-weight:700;letter-spacing:.15em}#msg{min-height:26px}</style>
<main><div class="badge">X77FANS · LINK CARD</div><h1>画像から、投稿用リンクを作成</h1><p>画像と移動先を設定して公開します。画像は1200×630の枠いっぱいに表示し、はみ出す部分を中央基準でトリミングします。</p><div class="grid"><section><form id="form"><label for="image">宣伝画像</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp" required><label for="title">カードタイトル</label><input id="title" maxlength="150" value="X77Fans｜クリエイター向けガイド" required><label for="destination">クリック先URL</label><input id="destination" type="url" placeholder="https://…" value="https://ko-company.com/misc/x77fans/creators/guide.php" required><label for="token">社内用パスワード</label><input id="token" type="password" autocomplete="current-password" placeholder="管理者から共有されたパスワード" required><p><small>画像とカードは公開されます。社内用パスワードを入力して作成してください。</small></p><button id="publish">作成して公開する</button></form></section><section><h2>カード画像プレビュー</h2><canvas id="preview" width="1200" height="630"></canvas><p id="previewTitle">X77Fans｜クリエイター向けガイド</p><small>x77fans.github.io から<br>実際の表示・切り抜きはXの画面によって異なります。</small><p id="msg" role="status"></p><p id="status" role="status"></p><div id="result" hidden><strong>投稿用URL</strong><input id="url" readonly aria-label="投稿用URL"><button id="copy">URLをコピー</button> <a id="open" target="_blank" rel="noopener noreferrer">ページを確認</a><p id="ready">GitHubに保存しました。公開への反映には時間がかかります。ページを確認してからXへ貼り付けてください。</p></div></section></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('preview'),ctx=canvas.getContext('2d');let loaded=false;
function background(){ctx.fillStyle='#071023';ctx.fillRect(0,0,1200,630)}background();
$('title').oninput=()=>$('previewTitle').textContent=$('title').value;
$('image').onchange=async()=>{loaded=false;const file=$('image').files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>15*1024*1024){$('msg').textContent='PNG・JPEG・WebPの15MB以下の画像を選んでください。';return}let img;try{img=await createImageBitmap(file);background();const scale=Math.max(1200/img.width,630/img.height);const w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(1200-w)/2,(630-h)/2,w,h);img.close();loaded=true;$('msg').textContent='枠いっぱいに表示しました。はみ出した部分はトリミングされます。'}catch{$('msg').textContent='画像を読み込めませんでした。'}};
$('form').onsubmit=async event=>{event.preventDefault();if(!loaded){$('msg').textContent='画像を選んでください。';return}let dest;try{dest=new URL($('destination').value);if(dest.protocol!=='https:')throw Error();if(dest.username||dest.password)throw Error()}catch{$('msg').textContent='移動先にはhttps://で始まるURLを入力してください。';return}
const title=$('title').value.trim();if(!title)return;const token=$('token').value.trim();$('publish').disabled=true;$('result').hidden=true;$('status').textContent='画像を準備しています…';
let saved=false;
try{
const data=canvas.toDataURL('image/jpeg',.94).split(',')[1];
if(data.length>3800000)throw Error('画像の容量が大きすぎます。別の画像を選んでください。');
$('status').textContent='画像とカードを保存しています…';
const response=await fetch('https://x77-card-api.dgsnbs-nekogumi.workers.dev/',{method:'POST',headers:{'Content-Type':'application/json','X-App-Password':token},body:JSON.stringify({title,destination:dest.href,image:data}),redirect:'error'});
let result;try{result=await response.json()}catch{throw Error('保存サービスからの応答を読み取れませんでした。管理者に連絡してください。')}
if(!response.ok||!result.ok)throw Error(result.error||'保存に失敗しました。');
const returned=new URL(result.url);if(returned.origin!=='https://x77fans.github.io'||!returned.pathname.startsWith('/cards/'))throw Error('返されたURLが正しくありません。');
const page=returned.href;saved=true;
$('url').value=page;$('open').href=page;$('result').hidden=false;$('status').textContent='保存完了。公開反映を待っています。';
}catch(error){$('status').textContent=error.message||'通信に失敗しました。接続を確認してください。'}finally{$('publish').disabled=false;if(saved)$('msg').textContent='新しいカードを作成するたびに、別のURLが発行されます。'}
};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('url').value);$('copy').textContent='コピーしました'}catch{$('url').select();$('status').textContent='URLを選択しました。Ctrl+Cでコピーしてください。'}};
</script></html>
